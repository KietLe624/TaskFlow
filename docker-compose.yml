services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend
    restart: always
    environment:
      DB_HOST: db # Dùng tên service làm host
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      DB_DIALECT: ${DB_DIALECT}
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # --- THÊM PHẦN NÀY ĐỂ BACKEND TỰ CẬP NHẬT ---
    volumes:
      - ./backend:/app             # 1. Map code máy thật vào container
      - /app/node_modules          # 2. Giữ node_modules riêng của container
    command: npm run dev           # 3. Chạy lệnh dev (thường dùng nodemon) thay vì node app.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      # Lưu ý: Dockerfile của dev nên là loại chỉ cài Node, chưa build sang Nginx
    container_name: taskflow_frontend
    restart: always
    ports:
      - "4200:4200" # Đổi về 4200 vì ng serve chạy port này
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    # --- THÊM PHẦN NÀY ĐỂ FRONTEND TỰ CẬP NHẬT ---
    volumes:
      - ./frontend:/app            # 1. Map code máy thật vào container
      - /app/node_modules          # 2. Giữ node_modules riêng
    # 3. Ghi đè lệnh chạy mặc định bằng ng serve
    # command: npm start -- --host 0.0.0.0 --poll 2000 --allowed-hosts all

volumes:
  db_data: