<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-4 dark:bg-gray-900">
  <div class="w-full max-w-md space-y-8">

    <div class="text-center">
      <h1 class="text-3xl font-bold text-gray-900 sm:text-4xl dark:text-white">
        Quên Mật khẩu?
      </h1>
      <p class="mt-4 text-gray-500 dark:text-gray-400">
        Đừng lo lắng. Nhập email của bạn và chúng tôi sẽ gửi một liên kết để đặt lại mật khẩu.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="email" class="sr-only">Email</label>
        <div class="relative">
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            required
            class="w-full rounded-lg border-gray-200 bg-white p-4 text-sm shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-primary-500
                   px-10 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder-gray-500"
            placeholder="Nhập email của bạn"
          />
          <span
            class="absolute inset-y-0 start-0 grid place-content-center px-4"
          >
            <i class="fas fa-envelope text-gray-400 dark:text-gray-500"></i>
          </span>
        </div>
      </div>

      <div *ngIf="errorMessage" class="text-center text-red-500 dark:text-red-400 text-sm font-bold py-1">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="text-center text-green-600 dark:text-green-500 text-sm font-bold py-1">
        {{ successMessage }}
      </div>

      <div class="flex items-center justify-between">
        <p class="text-sm text-gray-500 dark:text-gray-400">
          <a
            routerLink="/login"
            class="underline text-gray-700 font-medium hover:text-primary-600 cursor-pointer
                   dark:text-gray-300 dark:hover:text-primary-500"
            >Quay lại Đăng nhập</a
          >
        </p>
        <button
          type="submit"
          [disabled]="isLoading"
          class="inline-block rounded-lg bg-primary-600 px-6 py-3 text-sm font-medium text-white shadow-md
                 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2
                 transition-colors dark:focus:ring-offset-gray-900
                 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ isLoading ? 'Đang gửi...' : 'Gửi liên kết' }}
        </button>
      </div>
    </form>

  </div>
</div>
