<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-4 dark:bg-gray-900">
  <div class="w-full max-w-md space-y-8">

    <div class="text-center">
      <h1 class="text-3xl font-bold text-gray-900 sm:text-4xl dark:text-white">
        Đặt lại Mật khẩu
      </h1>
      <p class="mt-4 text-gray-500 dark:text-gray-400">
        Vui lòng nhập mật khẩu mới cho tài khoản của bạn.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="password" class="sr-only">Mật khẩu mới</label>
        <div class="relative">
          <input [(ngModel)]="newPassword" name="newPassword" type="password" required class="w-full rounded-lg border-gray-200 bg-white p-4 text-sm shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-primary-500
                   px-10 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder-gray-500"
            placeholder="Nhập mật khẩu mới" />
          <span class="absolute inset-y-0 end-0 grid place-content-center px-4">
            <i class="fas fa-eye text-gray-400 dark:text-gray-500"></i>
          </span>
        </div>
      </div>

      <div>
        <label for="confirmPassword" class="sr-only">Xác nhận Mật khẩu</label>
        <div class="relative">
          <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required class="w-full rounded-lg border-gray-200 bg-white p-4 text-sm shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-primary-500
                   px-10 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder-gray-500"
            placeholder="Xác nhận mật khẩu mới" />
          <span class="absolute inset-y-0 end-0 grid place-content-center px-4">
            <i class="fas fa-eye text-gray-400 dark:text-gray-500"></i>
          </span>
        </div>
      </div>

      <div *ngIf="errorMessage" class="text-center text-red-500 dark:text-red-400 text-sm font-bold py-1">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="text-center text-green-600 dark:text-green-500 text-sm font-bold py-1">
        {{ successMessage }}
      </div>

      <div class="flex items-center justify-end">
        <button type="submit" [disabled]="isLoading || !token" class="inline-block rounded-lg bg-primary-600 px-6 py-3 text-sm font-medium text-white shadow-md
                 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2
                 transition-colors dark:focus:ring-offset-gray-900
                 disabled:bg-gray-400 disabled:cursor-not-allowed">
          {{ isLoading ? 'Đang lưu...' : 'Lưu mật khẩu' }}
        </button>
      </div>
    </form>

  </div>
</div>
