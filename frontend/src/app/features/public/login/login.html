<div class="min-h-screen flex flex-col bg-gray-50 dark:bg-gray-900">

  <main class="flex-1 flex items-center justify-center px-4">

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 md:p-10 w-full max-w-md">
      <h2 class="text-3xl font-bold text-center text-gray-900 dark:text-gray-100 mb-6">
        Đăng nhập vào <span class="text-primary-700">TaskFlow</span>
      </h2>

      <form (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label class="block text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <input type="email" [(ngModel)]="emailOrUsername" name="email" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700
                         focus:ring-2 focus:ring-primary outline-none dark:bg-gray-900 dark:text-gray-100" />
        </div>

        <div>
          <label class="block text-gray-700 dark:text-gray-300 mb-1">Mật khẩu</label>
          <input type="password" [(ngModel)]="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700
                         focus:ring-2 focus:ring-primary outline-none dark:bg-gray-900 dark:text-gray-100" />
        </div>

        <div *ngIf="errorMessage" class="text-center text-red-500 text-base font-semibold py-2">
          {{ errorMessage }}
        </div>

        <button type="submit"
          class="w-full bg-primary text-white py-2.5 rounded-lg hover:bg-primary-700 transition-colors duration-200">
          Đăng nhập
        </button>
      </form>

      <p class="text-center text-gray-600 dark:text-gray-400 mt-6">
        Chưa có tài khoản?
        <a routerLink="/register" class="text-primary hover:underline">Đăng ký ngay</a>
      </p>
    </div>
  </main>
  <app-footer></app-footer>
</div>
