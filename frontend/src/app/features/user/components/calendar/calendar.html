<div class="p-3 md:p-6 bg-gray-50 dark:bg-gray-900 min-h-screen animate-fade-in-up flex flex-col">

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 md:mb-6">
    <div>
      <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-200">Lịch Công Việc</h1>
      <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 mt-1">Quản lý timeline và deadline dự án</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
    </div>
  </div>

  <div
    class="flex-1 bg-white dark:bg-gray-800 p-2 md:p-4 rounded-xl md:rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden custom-calendar flex flex-col min-h-[500px] md:min-h-[600px]">

    <full-calendar [options]="calendarOptions" class="h-full w-full"></full-calendar>
  </div>

</div>
