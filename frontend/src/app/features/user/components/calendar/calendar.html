<div class="p-6 bg-gray-50 dark:bg-gray-900 min-h-screen animate-fade-in-up">

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">

    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Lịch Công Việc</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Quản lý timeline và deadline dự án</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 items-end sm:items-center">
    </div>
  </div>

  <div
    class="bg-white dark:bg-gray-800 p-1 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden custom-calendar h-[75vh] min-h-[600px]">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

</div>
