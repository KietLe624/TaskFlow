<div
  class="max-w-xl mx-auto bg-white dark:bg-gray-900 rounded-xl shadow-lg border border-gray-100 dark:border-gray-800 overflow-hidden">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-5 py-3 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-4">
      {{ isEditMode ? 'Sửa dự án' : 'Tạo dự án mới' }}
    </h2>
  </div>
  <!-- Form -->
  <form [formGroup]="projectForm" (ngSubmit)="submitForm()" class="p-5 space-y-5">
    <!--  Basic Info -->
    <section>
      <h3 class="text-base font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
        <i class="fas fa-info-circle text-blue-400"></i> Basic Info
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Project Name *</label>
          <input type="text" formControlName="project_name" placeholder="e.g. Website Redesign"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition" />
          @if (projectForm.get('project_name')?.invalid && projectForm.get('project_name')?.touched) {
          <p class="text-xs text-red-500 mt-1">Project name is required</p>
          }
        </div>

        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Client</label>
          <input type="text" formControlName="client" placeholder="Client / Organization"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition" />
        </div>
      </div>

      <div class="mt-3">
        <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Description</label>
        <textarea formControlName="description" rows="2" placeholder="Short overview..."
          class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition resize-none"></textarea>
      </div>
    </section>

    <!-- Status & Priority -->
    <section>
      <h3 class="text-base font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
        <i class="fas fa-cogs text-blue-400"></i> Settings
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Status</label>
          <select formControlName="status"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition">
            <option value="">Select status</option>
            @for (s of statuses; track s) {
            <option [value]="s">{{ s | projectStatus }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Priority</label>
          <select formControlName="priority"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition">
            @for (p of priorities; track p) {
            <option [value]="p">{{ p | projectPriority }}</option>
            }
          </select>
        </div>
      </div>
    </section>

    <!-- Timeline -->
    <section>
      <h3 class="text-base font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
        <i class="fas fa-calendar-alt text-blue-400"></i> Timeline
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Start Date *</label>
          <input type="date" formControlName="start_date"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition" />
        </div>

        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Due Date *</label>
          <input type="date" formControlName="due_date"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition" />
        </div>
      </div>
    </section>

    <!-- Budget & Team -->
    <section>
      <h3 class="text-base font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
        <i class="fas fa-users text-blue-400"></i> Team & Budget
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Budget</label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-400 dark:text-gray-500">$</span>
            <input type="number" formControlName="budget" min="0" placeholder="0.00"
              class="w-full pl-7 rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition" />
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">Team</label>
          <select formControlName="team_id"
            class="w-full rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-800 px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 dark:text-gray-100 transition">
            <option value="">Select a team</option>
            @for (t of teams; track t.team_id) {
            <option [value]="t.team_id">{{ t.team_name }}</option>
            }
          </select>
        </div>
      </div>
    </section>

    <!-- Submit -->
    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
      <button type="button" (click)="closeCreateModal()"
        class="px-4 py-1.5 rounded-md border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-red-600 hover:text-white transition ">
        Thoát
      </button>
      <button type="submit" class="w-24 text-white bg-blue-600 rounded-lg
               font-semibold text-center transition-all duration-200 ease-in-out
               hover:bg-blue-700
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50
               active:scale-95">
        {{ isEditMode ? 'Cập nhật' : 'Tạo mới' }}
      </button>
    </div>
  </form>
</div>
