<div
  class="max-w-xl mx-auto bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 overflow-hidden">
  <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800/50">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
      {{ isEditMode ? 'Chỉnh sửa công việc' : 'Thêm công việc mới' }}
    </h2>
  </div>

  <form [formGroup]="taskForm" (ngSubmit)="submitTaskForm()" class="p-6 space-y-8">

    <section class="space-y-5">
      <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fas fa-info-circle"></i> Thông tin chung
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
            Dự án <span class="text-red-500">*</span>
          </label>
          <select formControlName="project_id" class="w-full rounded-lg border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-blue-500/10">
            @for (p of projects; track p.project_id) {
            <option [value]="p.project_id">{{ p.project_name }}</option>
            }
          </select>
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Công việc cha</label>
          <select formControlName="parent_id" class="w-full rounded-lg border-gray-100 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-blue-500/10">
            <option [ngValue]="null">-- Không có --</option>
            @for (t of parentCandidates; track t.task_id) {
            <option [value]="t.task_id">{{ t.task_name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="space-y-5">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
            Tên công việc <span class="text-red-500">*</span>
          </label>
          <input type="text" formControlName="task_name" placeholder="Nhập tên công việc..."
            class="w-full rounded-lg border-gray-300 bg-white text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder:text-gray-500 dark:focus:ring-blue-500/10" />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Mô tả</label>
          <textarea rows="3" formControlName="description" placeholder="Thêm mô tả chi tiết..."
            class="w-full rounded-lg border-gray-300 bg-white text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm resize-none
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder:text-gray-500 dark:focus:ring-blue-500/10"></textarea>
        </div>
      </div>
    </section>

    <section class="pt-6 border-t border-gray-100 dark:border-gray-800/50 space-y-5">
      <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fas fa-sliders-h"></i> Cài đặt
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Trạng thái</label>
          <select formControlName="status" class="w-full rounded-lg border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-blue-500/10">
            @for (s of statuses; track s) {
            <option [value]="s">{{ s | projectStatus }}</option>
            }
          </select>
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Độ ưu tiên</label>
          <select formControlName="priority" class="w-full rounded-lg border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-blue-500/10">
            @for (p of priorities; track p) {
            <option [value]="p">{{ p | projectPriority }}</option>
            }
          </select>
        </div>
      </div>
    </section>

    <section class="pt-6 border-t border-gray-100 dark:border-gray-800/50 space-y-5">
      <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-2">
        <i class="far fa-calendar-alt"></i> Thời gian
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Bắt đầu</label>
          <input type="date" formControlName="start_date"
            class="w-full rounded-lg border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:[color-scheme:dark] dark:focus:ring-blue-500/10" />
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Hạn chót</label>
          <input type="date" formControlName="due_date"
            class="w-full rounded-lg border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                               dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:[color-scheme:dark] dark:focus:ring-blue-500/10" />
        </div>
      </div>
    </section>

    <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-100 dark:border-gray-800/50">
      <button type="button" (click)="closed.emit()"
        class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-transparent border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition focus:outline-none focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-700">
        Hủy bỏ
      </button>
      <button type="submit" [disabled]="isSubmitting"
        class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 shadow-sm">
        @if (isSubmitting) { <i class="fas fa-spinner fa-spin"></i> }
        {{ isEditMode ? 'Lưu thay đổi' : 'Tạo công việc' }}
      </button>
    </div>
  </form>
</div>
