<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="absolute inset-0" (click)="cancel()"></div>

  <div
    class="relative w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 overflow-hidden">
    <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800/50">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
        {{ isEditMode ? 'Cập nhật Team' : 'Tạo Team mới' }}
      </h2>
    </div>

    <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Tên Team <span class="text-red-500">*</span>
        </label>
        <input type="text" formControlName="team_name" placeholder="VD: Frontend Team..."
          class="w-full rounded-lg border-gray-300 bg-white text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm py-2.5 px-3 text-sm
                           dark:bg-gray-900 dark:border-gray-700 dark:text-white dark:placeholder:text-gray-500 dark:focus:ring-blue-500/10" />
        @if (teamForm.get('team_name')?.invalid && teamForm.get('team_name')?.touched) {
        <p class="text-xs text-red-500 mt-1">Tên team không được để trống.</p>
        }
      </div>

      <div class="flex items-center justify-end gap-3 pt-6">
        <button type="button" (click)="cancel()"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-transparent border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition">
          Hủy bỏ
        </button>
        <button type="submit" [disabled]="isSubmitting || teamForm.invalid" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition disabled:opacity-50 flex items-center gap-2 shadow-sm">
          @if (isSubmitting) { <i class="fas fa-spinner fa-spin"></i> }
          {{ isEditMode ? 'Lưu thay đổi' : 'Tạo Team' }}
        </button>
      </div>
    </form>
  </div>
</div>
