<button (click)="openModal()"
  class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 flex items-center gap-2 transition shadow-sm">
  <i class="fas fa-user-plus"></i>
  <span>Mời thành viên</span>
</button>

<div *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all scale-100 animate-fade-in-up">

    <div class="flex justify-between items-center mb-5">
      <h3 class="text-xl font-bold text-gray-800">Mời thành viên mới</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 transition p-1">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Địa chỉ Email</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-envelope text-gray-400"></i>
        </div>
        <input type="email" [(ngModel)]="email" placeholder="nhanvien@example.com" (keyup.enter)="submitInvite()"
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50">
      </div>
      <p class="text-xs text-gray-500 mt-2 italic">
        * Người dùng phải có tài khoản trong hệ thống.
      </p>
    </div>

    <div class="flex justify-end gap-3 border-t pt-4">
      <button (click)="closeModal()"
        class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition font-medium text-sm">
        Hủy bỏ
      </button>
      <button (click)="submitInvite()" [disabled]="isInviting"
        class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium text-sm flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
        <span *ngIf="isInviting"
          class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        {{ isInviting ? 'Đang gửi...' : 'Gửi lời mời' }}
      </button>
    </div>
  </div>
</div>
