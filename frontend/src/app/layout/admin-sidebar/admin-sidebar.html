<div
  class="w-64 h-screen bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col sticky top-0 shadow-sm z-30">

  <div class="h-16 flex items-center px-6 border-b border-gray-100 dark:border-gray-800">
    <div class="flex items-center space-x-3 cursor-pointer">
      <a routerLink="/admin/dashboard" class="flex items-center space-x-3 overflow-hidden flex-1">
        <img src="/check.png" alt="TaskFlow Logo" class="h-8 w-8 flex-shrink-0" />
        <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-300 whitespace-nowrap">
          Task<span class="text-primary-600">Flow</span>
        </h2>
      </a>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 px-3 custom-scrollbar">

    <div class="mb-2">
      <p class="px-3 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-2">Tổng quan</p>

      <a routerLink="/admin/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
        class="nav-item">
        <i class="fas fa-th-large w-5"></i>
        <span>Dashboard</span>
      </a>
    </div>

    <div class="mb-2">
      <p class="px-3 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4">Quản lý</p>

      <a routerLink="/admin/users" routerLinkActive="active-link" class="nav-item">
        <i class="fas fa-users w-5"></i>
        <span>Người dùng</span>
      </a>

      <a routerLink="/admin/teams" routerLinkActive="active-link" class="nav-item">
        <i class="fas fa-users-cog w-5"></i>
        <span>Teams</span>
      </a>

      <a routerLink="/admin/projects" routerLinkActive="active-link" class="nav-item">
        <i class="fas fa-layer-group w-5"></i>
        <span>Dự án</span>
      </a>
    </div>

    <div class="mb-2">
      <p class="px-3 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4">Hệ thống</p>

      <a routerLink="/admin/activities" routerLinkActive="active-link" class="nav-item">
        <i class="fas fa-history w-5"></i>
        <span>Hoạt động</span>
      </a>

      <a routerLink="/admin/settings" routerLinkActive="active-link" class="nav-item">
        <i class="fas fa-cog w-5"></i>
        <span>Cài đặt</span>
      </a>
    </div>

  </nav>

  <div class="p-4 border-t border-gray-100 dark:border-gray-800">
    <div
      class="flex items-center space-x-3 p-2 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors cursor-pointer group">
      <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
        class="w-9 h-9 rounded-full border border-gray-200">

      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-200 truncate">Admin User</h4>
      </div>

      <button (click)="logout()" class="text-gray-400 hover:text-red-500 transition-colors">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</div>
