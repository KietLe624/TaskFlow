<header
  class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 p-4 flex items-center justify-between">
  <div class="flex items-center space-x-4 ">
    <button class="md:hidden text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200 text-xl">
      <i class="fa-solid fa-bars"></i>
    </button>

    <h1 class="hidden md:inline text-2xl font-bold dark:text-gray-200 text-gray-800">
      {{ pageTitle }} </h1>
  </div>

  <div class="flex items-center space-x-6">

    <button class="md:hidden text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">
      <i class="fas fa-search fa-lg"></i>
    </button>

    <div class="relative hidden md:block">
      <input type="text" placeholder="Search for task and etc."
        class="w-72 rounded-lg border-1 border-gray-400 bg-gray-200 py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-primary-500 dark:bg-gray-700" />
      <span class="absolute inset-y-0 left-0 grid place-content-center pl-3">
        <i class="fas fa-search text-gray-400"></i>
      </span>
    </div>

    <div class="flex items-center space-x-4">

      <div class="relative">

        <button (click)="openNotifications()"
          class="relative text-gray-500 hover:text-gray-800 dark:text-gray-300 dark:hover:text-white focus:outline-none transition-colors">
          <i class="fas fa-bell fa-lg"></i>

        </button>

        @if (isOpenNoti) {
        <div class="fixed inset-0 z-40 cursor-default" (click)="closeNotifications()"></div>

        <div
          class="absolute right-0 mt-3 w-80 sm:w-96 z-50 origin-top-right bg-white rounded-lg shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none">

          <app-notifications></app-notifications>

        </div>
        }
      </div>
      <app-theme-toggle></app-theme-toggle>

    </div>

    <div class="relative inline-block text-left">
      <div>
        <button type="button" (click)="toggleDropdown()"
          class="flex items-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
          id="user-menu-button" aria-expanded="false" aria-haspopup="true">
          <span class="sr-only">Open user menu</span>
          <img class="h-10 w-10 rounded-full object-cover"
            src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=40&h=40&fit=crop&crop=faces"
            alt="User Avatar" />
        </button>
      </div>

      <div [ngClass]="{
     'hidden opacity-0 scale-95': !isDropdownOpen,
     'block opacity-100 scale-100': isDropdownOpen
   }" class="absolute right-0 z-10 mt-4 w-64 h-64 origin-top-right rounded-md bg-white dark:bg-gray-800
           py-1 shadow-lg ring-1 ring-black ring-opacity-5 dark:ring-gray-700 focus:outline-none
           transition ease-out duration-100 transform" role="menu" aria-orientation="vertical"
        aria-labelledby="user-menu-button" tabindex="-1">
        <a href="#"
          class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
          role="menuitem" tabindex="-1">Your Profile</a>
        <a href="#"
          class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
          role="menuitem" tabindex="-1">Settings</a>

        <button (click)="onLogout()"
          class="block w-full px-4 py-2 text-left text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-gray-700"
          role="menuitem" tabindex="-1">
          <i class="fa-solid fa-right-to-bracket"></i>
          Đăng xuất
        </button>
      </div>
    </div>
  </div>
</header>
