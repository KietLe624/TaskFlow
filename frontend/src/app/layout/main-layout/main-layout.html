<div class="flex h-screen bg-white dark:text-gray-200 dark:bg-gray-900 transition-all duration-500 ease-in-out">

  @if (isMobileSidebarOpen) {
  <div class="fixed inset-0 z-20 bg-black/50 transition-opacity md:hidden" (click)="closeMobileSidebar()"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 bg-white dark:bg-gray-800 transition-transform duration-300 transform md:translate-x-0 md:static md:inset-0 border-r border-gray-200 dark:border-gray-700"
    [class.-translate-x-full]="!isMobileSidebarOpen" [class.translate-x-0]="isMobileSidebarOpen">

    <app-side-bar (closeSidebar)="closeMobileSidebar()"></app-side-bar>
  </aside>

  <div class="flex-1 flex flex-col h-screen">

    <app-main-header (toggleSidebar)="toggleMobileSidebar()"></app-main-header>

    <main class="flex-1 overflow-y-auto bg-gray-50 p-6 dark:text-gray-200 dark:bg-gray-900 ">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
